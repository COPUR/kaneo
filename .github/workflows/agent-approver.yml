name: Agent Approver

# The CI approver agent: a separate identity from the CI/CD agent that commits.
# It runs the checks and the code analysis gate, then approves the pull request
# or hands it to a person. When it approves, the CI/CD agent merges.
#
# Identities (both optional; without them the workflow uses GITHUB_TOKEN):
#   vars.APPROVER_APP_ID + secrets.APPROVER_APP_PRIVATE_KEY  the approver app
#   vars.CICD_APP_ID + secrets.CICD_APP_PRIVATE_KEY          the committing app
# GITHUB_TOKEN can approve only when the repository allows GitHub Actions to
# create and approve pull requests (Settings → Actions → General).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: agent-approver-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: i18n and OpenAPI are in sync
        run: |
          pnpm i18n:check
          pnpm openapi:check

      - name: Approver rules
        run: node --test scripts/agent-approver/rules.test.mjs

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.analyze.outputs.verdict }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0

      - name: Code analysis gate
        id: analyze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/agent-approver/analyze.mjs "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approver-report
          path: approver-report.md

  decide:
    needs: [verify, analyze]
    # Fork pull requests get no secrets and a read-only token, so the agent only
    # reviews pull requests from branches in this repository. Drafts wait.
    if: >-
      always() &&
      needs.analyze.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      approved: ${{ steps.review.outputs.approved }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approver-report

      - name: Approver identity
        id: app
        if: vars.APPROVER_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}

      - name: Approve or hand to a person
        id: review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERIFY: ${{ needs.verify.result }}
          VERDICT: ${{ needs.analyze.outputs.verdict }}
        run: |
          set -euo pipefail
          gh label create needs-human --color f59e0b \
            --description "The approver agent wants a person to review" 2>/dev/null || true
          if [ "$VERIFY" != "success" ]; then
            printf '\n**Checks did not pass** (%s). Fix them and push; I will review again.\n' "$VERIFY" >> approver-report.md
            gh pr review "$PR_NUMBER" --request-changes --body-file approver-report.md
            echo "approved=false" >> "$GITHUB_OUTPUT"
          elif [ "$VERDICT" = "approve" ]; then
            gh pr review "$PR_NUMBER" --approve --body-file approver-report.md
            gh pr edit "$PR_NUMBER" --remove-label needs-human 2>/dev/null || true
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            gh pr review "$PR_NUMBER" --comment --body-file approver-report.md
            gh pr edit "$PR_NUMBER" --add-label needs-human
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

  merge:
    needs: [decide]
    if: needs.decide.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: CI/CD agent identity
        id: app
        if: vars.CICD_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CICD_APP_ID }}
          private-key: ${{ secrets.CICD_APP_PRIVATE_KEY }}

      # Pinned to the reviewed commit: a push after the approval stops the merge.
      - name: Merge as the CI/CD agent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA" \
            || gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
