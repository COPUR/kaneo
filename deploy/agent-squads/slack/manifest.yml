# Slack app manifest for the Kaneo listener agent. Paste it at
# https://api.slack.com/apps -> Create New App -> From a manifest.
# Socket Mode: Slack pushes events over a WebSocket, so no public URL.
display_information:
  name: Kaneo Listener
  description: Turns Slack requests into Kaneo cards for the EV PnC agent squads.
  background_color: "#1e293b"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: kaneo
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
